# Blueprint do Render: o ficheiro tem de se chamar render.yaml e estar na raiz do repositório.
# Região: frankfurt (a API e a base de dados têm de estar na mesma região).
# Plano gratuito = só para testes. Ver docs/deploy.md (limites e riscos).
services:
  - type: web
    name: nexora-api
    runtime: node
    region: frankfurt
    plan: free
    # `...` inclui os pacotes de que a API depende (shared, deriv-client), compilados por ordem.
    # --frozen-lockfile: exige o pnpm-lock.yaml no repositório (ver docs/deploy.md).
    # --production=false: o Render define NODE_ENV=production também no build, e sem esta opção o pnpm
    # não instala as devDependencies (typescript, @types/node) de que o build precisa.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --production=false --production=false && pnpm --filter @nexora/api... build
    # No plano gratuito não há preDeployCommand: as migrações correm no arranque.
    # Seguro com uma só instância (e com lock na base de dados se houver mais).
    # Num plano pago, mover o `migrate` para preDeployCommand.
    startCommand: pnpm --filter @nexora/api migrate && pnpm --filter @nexora/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-db
          property: connectionString
      # Ligação interna do Render. Se falhar com erro de TLS/SSL, ver docs/deploy.md.
      - key: DATABASE_SSL
        value: no-verify
      # O Render pede estas 3 no painel ao criar o Blueprint (valores nunca vão para o Git).
      # Têm de ser preenchidas todas: com a chave abaixo sempre definida, a autenticação
      # fica ativa e a API recusa arrancar se faltar alguma.
      - key: WEB_ORIGIN
        sync: false
      - key: DERIV_APP_ID
        sync: false
      - key: DERIV_OAUTH_REDIRECT_URI
        sync: false
      # Chave que cifra os tokens guardados: o Render gera um valor aleatório de 256 bits
      # (base64) na primeira sincronização e mantém-no. Não editar nem apagar:
      # trocar a chave torna ilegíveis os tokens já guardados (os utilizadores voltam a fazer login).
      - key: APP_ENCRYPTION_KEY
        generateValue: true

databases:
  - name: nexora-db
    region: frankfurt
    plan: free
    databaseName: nexora
    user: nexora
    # Sem acesso externo: só serviços do Render na mesma região.
    ipAllowList: []
